name: Moteur momentum (hebdomadaire)

on:
  schedule:
    - cron: "17 6 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les bibliotheques
        run: pip install -q yfinance pandas numpy

      - name: Executer la strategie
        run: python moteur.py

      - name: Enregistrer les resultats
        run: |
          git config user.name "agent-momentum"
          git config user.email "agent-momentum@users.noreply.github.com"
          git add etat/
          git commit -m "Mise a jour du $(date -u +%Y-%m-%d)" || echo "Rien de nouveau"
          git push
